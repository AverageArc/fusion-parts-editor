<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts editor</title>
<script>try{var t=localStorage.getItem('fpe-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  color-scheme: light dark;
  --bg:#f4f4f1; --panel:#ffffff; --panel-2:#ecece7; --ink:#1b1b1a; --muted:#62625d; --line:#d9d9d2; --stage:#e9e9e4;
  --accent:#2f6fd6; --on-accent:#fff; --warn:#b0620a; --ok:#2a8a4f; --bad:#c43b2f; --changed:#fff6d6; --focus:#1b1b1a;
  --r:10px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151517; --panel:#1f1f22; --panel-2:#2a2a2e; --ink:#ececea; --muted:#a3a39d; --line:#34343a; --stage:#101012;
    --accent:#6ea2ff; --on-accent:#101012; --warn:#f0a050; --ok:#5fd08a; --bad:#ff7a6e; --changed:#3a3417; --focus:#ececea;
  }
}
:root[data-theme="dark"]{
  --bg:#151517; --panel:#1f1f22; --panel-2:#2a2a2e; --ink:#ececea; --muted:#a3a39d; --line:#34343a; --stage:#101012;
  --accent:#6ea2ff; --on-accent:#101012; --warn:#f0a050; --ok:#5fd08a; --bad:#ff7a6e; --changed:#3a3417; --focus:#ececea;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.app{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(480px,1.5fr);height:100vh;height:100dvh}
.viewer-col{position:relative;min-width:0}
.stage{position:absolute;inset:0;background:var(--stage);overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.tools{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:3;pointer-events:none}
.tools>*{pointer-events:auto}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap}
.tip[hidden]{display:none}
.hint{position:absolute;left:10px;bottom:8px;z-index:3;font-size:11.5px;color:var(--muted);pointer-events:none}
.panel-col{min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg);height:100vh;height:100dvh}
.head{padding:12px 14px 6px}
.head h1{margin:0;font-size:17px;line-height:1.25}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--panel)}
.pill.on{border-color:var(--accent);color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 14px 8px;border-bottom:1px solid var(--line)}
.bar input[type=search],.bar select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.bar input[type=search]{flex:1;min-width:140px}
.bar label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;cursor:pointer}
.bulk{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.bulk[hidden]{display:none}
.bulk input,.bulk select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 7px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.small{padding:2px 8px;font-size:12px}
#rows{flex:1;overflow:auto;padding:8px 14px 14px;display:flex;flex-direction:column;gap:8px}
.part{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.part.changed{border-color:var(--warn);background:linear-gradient(0deg,var(--panel),var(--panel)) padding-box}
.part.sel{box-shadow:0 0 0 2px var(--accent)}
.part.flash{animation:flash 1.1s}
@keyframes flash{0%{background:var(--changed)}100%{background:var(--panel)}}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pname{flex:1;min-width:150px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--panel-2)}
.pname:disabled{opacity:.7}
.badge{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--muted);white-space:nowrap}
.badge.link{border-color:var(--warn);color:var(--warn)}
.mass{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mass b{color:var(--warn)}
.ppath{font-size:11.5px;color:var(--muted);margin:1px 0 4px 26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 8px;align-items:end;padding:5px 0 3px 26px;border-top:1px dashed var(--line)}
.body:first-of-type{border-top:0}
.f{display:flex;flex-direction:column;gap:1px;min-width:0}
.f>span{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.f input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
.f input.edited{border-color:var(--warn);background:var(--changed)}
.f input.bad{border-color:var(--bad)}
.f input:disabled{opacity:.55}
.approw{display:flex;gap:4px;align-items:center}
.sw{flex:none;width:16px;height:16px;border-radius:4px;border:1px solid var(--line)}
input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;flex:none}
.colrow{display:flex;gap:4px;align-items:center}
.empty{color:var(--muted);padding:20px;text-align:center}
.answers{border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.answers p{margin:0;flex-basis:100%;font-size:12px;color:var(--muted)}
details.review{border-top:1px solid var(--line);padding:6px 14px;background:var(--panel);font-size:12.5px;max-height:30vh;overflow:auto}
details.review summary{cursor:pointer;font-weight:600}
details.review table{width:100%;border-collapse:collapse;margin-top:6px}
details.review td{padding:2px 6px 2px 0;border-top:1px solid var(--line);vertical-align:top}
details.review td.from{color:var(--muted);text-decoration:line-through}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .5);display:grid;place-items:center;z-index:20}
.modal[hidden]{display:none}
.modal>div{background:var(--panel);border-radius:12px;padding:14px;width:min(640px,92vw)}
.modal textarea{width:100%;height:260px;font:12px var(--mono);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (max-width:900px){
  .app{display:block;height:auto}
  .viewer-col{height:44vh;position:sticky;top:0;z-index:5}
  .panel-col{height:auto;border-left:0}
  #rows{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <section class="viewer-col" aria-label="3D view">
    <div class="stage" id="stage">
      <div class="tools">
        <div class="seg" role="group" aria-label="Views">
          <button data-view="home">Home</button><button data-view="front">Front</button><button data-view="top">Top</button><button data-view="right">Right</button>
        </div>
        <div class="seg" role="group" aria-label="Display">
          <button id="b-hidden" aria-pressed="false" title="Show parts that are hidden in Fusion, faintly">Show hidden</button>
          <button id="b-isolate" aria-pressed="false" title="Show only the ticked parts">Isolate ticked</button>
          <button id="b-up" title="Which axis points up in Fusion">Z up</button>
          <button id="b-theme" title="Light, dark or automatic">◐ Auto</button>
        </div>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="hint">Drag to rotate · wheel to zoom · middle/right-drag to pan · click a part to tick it</div>
    </div>
  </section>

  <section class="panel-col" aria-label="Parts">
    <div class="head"><h1 id="title"></h1><div class="pills" id="pills"></div></div>
    <div class="bar">
      <input type="search" id="q" placeholder="Search names, materials, paths" aria-label="Search parts">
      <select id="filter" aria-label="Filter parts">
        <option value="all">All parts</option><option value="changed">Changed</option><option value="unnamed">Default names (Body1, Component2…)</option>
        <option value="linked">Linked from other files</option><option value="hidden">Hidden in Fusion</option><option value="nomat">No material</option>
      </select>
      <select id="sort" aria-label="Sort parts"><option value="tree">Assembly order</option><option value="mass">Heaviest first</option><option value="name">Name A to Z</option><option value="count">Most copies first</option></select>
      <label title="Linked parts live in another Fusion file. Editing them changes that file too."><input type="checkbox" id="unlock"> Unlock linked</label>
    </div>
    <div class="bulk" id="bulk" hidden>
      <b id="bulkCount"></b>
      <select id="bulkAct" aria-label="Bulk action">
        <option value="material">Set material</option><option value="appearance">Set appearance</option><option value="color">Set color</option>
        <option value="find">Find and replace in names</option><option value="prefix">Add prefix to names</option><option value="suffix">Add suffix to names</option>
        <option value="bodyname">Name bodies like their part</option>
      </select>
      <span id="bulkInputs"></span>
      <button class="btn primary small" id="bulkGo">Apply</button>
      <button class="btn small" id="bulkNone">Clear ticks</button>
      <button class="btn small" id="bulkAll">Tick all shown</button>
    </div>
    <div id="rows"></div>
    <details class="review" id="review"><summary id="reviewSum">Review changes</summary><div id="changes"></div></details>
    <div class="answers">
      <button class="btn primary" id="copy">Copy answers</button>
      <button class="btn" id="download">Download .json</button>
      <button class="btn" id="reset">Reset all</button>
      <p>Nothing here changes Fusion. Click <b>Copy answers</b> and paste the result back to Claude, who will check it against the model and apply it.</p>
    </div>
  </section>
</div>
<div class="modal" id="modal" hidden><div><p>Select all, copy, and paste into the chat:</p><textarea id="modalText" readonly></textarea><p><button class="btn" id="modalClose">Close</button></p></div></div>
<datalist id="dl-mat"></datalist><datalist id="dl-app"></datalist>

function answers() {
  const edits = [];
  for (const p of changedParts()) {
    const e = { part: p.id, kind: p.kind, linked: p.referenced, paths: p.paths.slice(0, 400), partName: p.name };
    if (E[p.id]?.name) e.rename = { from: p.name, to: E[p.id].name };
    const bodies = [];
    p.bodies.forEach((b, k) => { const be = E[bk(p.id, k)]; if (!be) return; const o = { index: k, bodyName: b.name, was: {}, set: {} };
      for (const [f, v] of Object.entries(be)) { o.set[f] = v; if (f !== 'customColor') o.was[f] = b[f] ?? null; } bodies.push(o); });
    if (bodies.length) e.bodies = bodies; edits.push(e);
  }
  return { format: 'fusion-parts-answers/1', document: A.document.name, exportedAt: A.exportedAt, allowLinked: unlocked && edits.some(e => e.linked), edits };
}
$('#copy').onclick = async () => {
  const j = JSON.stringify(answers(), null, 1);
  try { await navigator.clipboard.writeText(j); $('#copy').textContent = 'Copied ✓'; setTimeout(() => $('#copy').textContent = 'Copy answers', 1800); }
  catch { $('#modalText').value = j; $('#modal').hidden = false; $('#modalText').select(); }
};
$('#modalClose').onclick = () => $('#modal').hidden = true;
$('#download').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(answers(), null, 1)], { type: 'application/json' })); a.download = 'parts-answers.json'; a.click(); };
$('#reset').onclick = () => { if (!Object.keys(E).length || confirm('Throw away all your edits?')) { E = {}; sel.clear(); save(); renderRows(); } };

/* theme */
const tb = $('#b-theme'), root = document.documentElement;
const state = () => root.getAttribute('data-theme') || 'auto';
const showTheme = () => { const s = state(); tb.textContent = s === 'light' ? '☀ Light' : s === 'dark' ? '☾ Dark' : '◐ Auto'; };
tb.onclick = () => { const o = ['auto', 'light', 'dark'], n = o[(o.indexOf(state()) + 1) % 3]; n === 'auto' ? root.removeAttribute('data-theme') : root.setAttribute('data-theme', n); try { n === 'auto' ? localStorage.removeItem('fpe-theme') : localStorage.setItem('fpe-theme', n); } catch {} showTheme(); };
showTheme();

/* ---------- go ---------- */
function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); cvs.style.width = '100%'; cvs.style.height = '100%'; camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
renderRows();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
